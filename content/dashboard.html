<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SprinklerMaster - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-emerald-900 to-slate-900 min-h-screen p-4">
    <div class="max-w-7xl mx-auto">

        <!-- Header -->
        <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-6 mb-6 border border-white/20">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between">
                <div>
                    <h1 class="text-4xl font-bold text-white mb-2">SprinklerMaster</h1>
                    <p class="text-emerald-200">Automated Irrigation Control</p>
                </div>
                <div class="mt-4 md:mt-0 flex flex-col items-start md:items-end gap-2">
                    <div id="system-status" class="flex items-center gap-2 bg-green-500/20 border border-green-500/50 rounded-full px-4 py-2">
                        <div class="w-3 h-3 bg-green-400 rounded-full animate-pulse"></div>
                        <span class="text-green-200 font-medium">System Online</span>
                    </div>
                    <p id="current-time" class="text-emerald-300 text-sm"></p>
                    <p id="server-time" class="text-emerald-400 text-xs"></p>
                    <p id="rtc-time" class="text-emerald-400 text-xs"></p>
                </div>
            </div>
        </div>

        <!-- Environmental Monitoring -->
        <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-6 mb-6 border border-white/20">
            <h2 class="text-2xl font-semibold text-white mb-4">Environmental Data</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="bg-white/5 rounded-xl p-6 border border-white/10">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-emerald-200 text-sm mb-1">Temperature</p>
                            <p class="text-5xl font-bold text-white">
                                <span id="temperature">--</span><span class="text-2xl text-emerald-300">°F</span>
                            </p>
                        </div>
                        <div class="text-6xl">🌡️</div>
                    </div>
                </div>
                <div class="bg-white/5 rounded-xl p-6 border border-white/10">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-emerald-200 text-sm mb-1">Humidity</p>
                            <p class="text-5xl font-bold text-white">
                                <span id="humidity">--</span><span class="text-2xl text-emerald-300">%</span>
                            </p>
                        </div>
                        <div class="text-6xl">💧</div>
                    </div>
                </div>
            </div>
            <p id="sensor-update" class="text-emerald-300 text-sm mt-4 text-center">Last updated: --</p>
        </div>

        <!-- Irrigation Zones -->
        <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-6 border border-white/20">
            <h2 class="text-2xl font-semibold text-white mb-6">Irrigation Zones</h2>
            <div id="zones-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <!-- Zones will be populated by JavaScript -->
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-6 mt-6 border border-white/20">
            <h2 class="text-2xl font-semibold text-white mb-4">Quick Actions</h2>
            <div class="flex flex-wrap gap-3 items-center">
                <button onclick="openManualControl()" class="bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/50 text-emerald-100 px-6 py-3 rounded-lg font-semibold transition-all">
                    Manual Control
                </button>
                <a href="/schedules.shtml" class="bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/50 text-emerald-100 px-6 py-3 rounded-lg font-semibold transition-all inline-block">
                    Schedule Manager
                </a>
                <a href="/zones.shtml" class="bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/50 text-emerald-100 px-6 py-3 rounded-lg font-semibold transition-all inline-block">
                    Zone Settings
                </a>
                <button onclick="stopAllZones()" class="ml-auto bg-red-500/20 hover:bg-red-500/30 border border-red-500/50 text-red-100 px-6 py-3 rounded-lg font-semibold transition-all">
                    Stop All
                </button>
            </div>
        </div>

        <!-- Manual Control Modal -->
        <div id="manual-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50">
            <div class="bg-slate-800 rounded-2xl shadow-2xl p-6 m-4 max-w-lg w-full border border-white/20">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-semibold text-white">Manual Control</h2>
                    <button onclick="closeManualControl()" class="text-gray-400 hover:text-white text-2xl">&times;</button>
                </div>
                <div class="mb-4">
                    <label class="text-emerald-200 text-sm">Run Duration</label>
                    <select id="manual-duration" class="w-full mt-1 bg-white/10 border border-white/20 text-white px-3 py-2 rounded-lg">
                        <option value="5">5 minutes</option>
                        <option value="10" selected>10 minutes</option>
                        <option value="15">15 minutes</option>
                        <option value="20">20 minutes</option>
                        <option value="30">30 minutes</option>
                        <option value="45">45 minutes</option>
                        <option value="60">60 minutes</option>
                    </select>
                </div>
                <div id="manual-zones" class="space-y-2 max-h-64 overflow-y-auto">
                    <!-- Zones will be populated here -->
                </div>
                <div class="mt-4 pt-4 border-t border-white/10">
                    <button onclick="stopAllZones(); closeManualControl();" class="w-full bg-red-500/30 hover:bg-red-500/40 border border-red-500/50 text-red-100 px-4 py-2 rounded-lg font-semibold transition-all">
                        Stop All Zones
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-8 pb-8">
            <p class="text-emerald-300 text-sm">
                Powered by FreeRTOS • lwIP • Pico SDK 2.2.0 • Raspberry Pi Pico 2W
            </p>
        </div>

    </div>

    <script>
        // API Configuration
        const API_BASE_URL = '/api';
        const SCHEDULE_TYPE_WEEKLY = 0;
        const SCHEDULE_TYPE_INTERVAL = 1;
        const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

        let schedules = [];

        // API Functions
        const API = {
            getSensorData: async () => {
                const response = await fetch(`${API_BASE_URL}/sensors`);
                return await response.json();
            },

            getZones: async () => {
                const response = await fetch(`${API_BASE_URL}/zones`);
                return await response.json();
            },

            getSchedules: async () => {
                const response = await fetch(`${API_BASE_URL}/schedules`);
                return await response.json();
            },

            getZoneStatus: async () => {
                const response = await fetch(`${API_BASE_URL}/zones/status`);
                return await response.json();
            },

            zoneOn: async (zoneId, duration = 10) => {
                const response = await fetch(`${API_BASE_URL}/zones/on?id=${zoneId}&dur=${duration}`);
                return await response.json();
            },

            zoneOff: async (zoneId) => {
                const response = await fetch(`${API_BASE_URL}/zones/off?id=${zoneId}`);
                return await response.json();
            },

            getServerTime: async () => {
                const response = await fetch(`${API_BASE_URL}/time`);
                return await response.json();
            }
        };

        let activeZone = 0;
        let remainingMins = 0;

        // Get day of year (1-366)
        function getDayOfYear(date) {
            const start = new Date(date.getFullYear(), 0, 0);
            const diff = date - start;
            const oneDay = 1000 * 60 * 60 * 24;
            return Math.floor(diff / oneDay);
        }

        // Calculate next run time for a schedule
        function getNextRunTime(schedule) {
            const now = new Date();

            if (schedule.type === SCHEDULE_TYPE_INTERVAL) {
                const interval = schedule.days;
                const lastDay = schedule.lastDay || 0;
                const lastYear = schedule.lastYear || 0;

                // If never run, show that it will run today/next at scheduled time
                if (lastDay === 0 || lastYear === 0) {
                    const todayTime = new Date(now);
                    todayTime.setHours(schedule.hour, schedule.minute, 0, 0);
                    if (todayTime > now) {
                        return { text: `Today ${formatTime(schedule.hour, schedule.minute)} (first run)`, date: todayTime };
                    } else {
                        const tomorrow = new Date(now);
                        tomorrow.setDate(tomorrow.getDate() + 1);
                        tomorrow.setHours(schedule.hour, schedule.minute, 0, 0);
                        return { text: `Tomorrow ${formatTime(schedule.hour, schedule.minute)} (first run)`, date: tomorrow };
                    }
                }

                // Calculate days since last run
                const currentDay = getDayOfYear(now);
                const currentYear = now.getFullYear();

                let daysSinceLastRun;
                if (currentYear === lastYear) {
                    daysSinceLastRun = currentDay - lastDay;
                } else {
                    // Handle year wraparound
                    const daysInLastYear = lastYear % 4 === 0 ? 366 : 365;
                    daysSinceLastRun = (daysInLastYear - lastDay) + currentDay + (currentYear - lastYear - 1) * 365;
                }

                const daysUntilNext = interval - (daysSinceLastRun % interval);
                const nextRun = new Date(now);

                if (daysUntilNext === interval) {
                    // Due today, check if time has passed
                    const todayTime = new Date(now);
                    todayTime.setHours(schedule.hour, schedule.minute, 0, 0);
                    if (todayTime > now) {
                        return { text: `Today ${formatTime(schedule.hour, schedule.minute)}`, date: todayTime };
                    }
                    // Time passed, next is in 'interval' days
                    nextRun.setDate(nextRun.getDate() + interval);
                } else {
                    nextRun.setDate(nextRun.getDate() + daysUntilNext);
                }

                nextRun.setHours(schedule.hour, schedule.minute, 0, 0);
                return { text: formatNextRun(nextRun, daysUntilNext === interval ? 0 : daysUntilNext), date: nextRun };
            }

            // Weekly schedule - find next matching day
            const currentDay = now.getDay();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            const scheduleMinutes = schedule.hour * 60 + schedule.minute;

            // Check each day starting from today
            for (let offset = 0; offset < 7; offset++) {
                const checkDay = (currentDay + offset) % 7;
                if (schedule.days & (1 << checkDay)) {
                    // This day is scheduled
                    if (offset === 0 && currentMinutes >= scheduleMinutes) {
                        // Today but time has passed, skip to next occurrence
                        continue;
                    }

                    const nextRun = new Date(now);
                    nextRun.setDate(now.getDate() + offset);
                    nextRun.setHours(schedule.hour, schedule.minute, 0, 0);

                    return { text: formatNextRun(nextRun, offset), date: nextRun };
                }
            }

            // Check next week if no day found this week
            for (let offset = 0; offset < 7; offset++) {
                const checkDay = (currentDay + offset) % 7;
                if (schedule.days & (1 << checkDay)) {
                    const nextRun = new Date(now);
                    nextRun.setDate(now.getDate() + offset + 7);
                    nextRun.setHours(schedule.hour, schedule.minute, 0, 0);
                    return { text: formatNextRun(nextRun, offset + 7), date: nextRun };
                }
            }

            return { text: 'Not scheduled', date: null };
        }

        function formatTime(hour, minute) {
            const h = hour % 12 || 12;
            const ampm = hour < 12 ? 'AM' : 'PM';
            return `${h}:${minute.toString().padStart(2, '0')} ${ampm}`;
        }

        function formatNextRun(date, daysFromNow) {
            const timeStr = formatTime(date.getHours(), date.getMinutes());
            if (daysFromNow === 0) {
                return `Today ${timeStr}`;
            } else if (daysFromNow === 1) {
                return `Tomorrow ${timeStr}`;
            } else {
                return `${dayNames[date.getDay()]} ${timeStr}`;
            }
        }

        // Get next scheduled run for a zone
        function getZoneNextRun(zoneId) {
            const zoneSchedules = schedules
                .filter(s => s.zone === zoneId && s.enabled)
                .map(s => ({ schedule: s, ...getNextRunTime(s) }))
                .filter(s => s.date !== null || s.schedule.type === SCHEDULE_TYPE_INTERVAL)
                .sort((a, b) => {
                    if (a.date && b.date) return a.date - b.date;
                    if (a.date) return -1;
                    if (b.date) return 1;
                    return 0;
                });

            if (zoneSchedules.length === 0) {
                return { text: 'No schedule', duration: null };
            }

            const next = zoneSchedules[0];
            return { text: next.text, duration: next.schedule.duration };
        }

        // Update current time (browser time)
        function updateTime() {
            const now = new Date();
            const options = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };
            document.getElementById('current-time').textContent = now.toLocaleDateString('en-US', options);
        }

        // Update server time (from NTP) and RTC time
        async function updateServerTime() {
            try {
                const data = await API.getServerTime();
                document.getElementById('server-time').textContent = `Server: ${data.time}`;
                document.getElementById('rtc-time').textContent = `RTC: ${data.rtc}`;
            } catch (error) {
                document.getElementById('server-time').textContent = 'Server: --';
                document.getElementById('rtc-time').textContent = 'RTC: --';
            }
        }

        // Load and display sensor data
        async function loadSensorData() {
            try {
                const data = await API.getSensorData();
                document.getElementById('temperature').textContent = data.temperature;
                document.getElementById('humidity').textContent = data.humidity;
                document.getElementById('sensor-update').textContent = `Last updated: ${data.lastUpdate}`;
            } catch (error) {
                console.error('Error loading sensor data:', error);
            }
        }

        // Create zone card HTML
        function createZoneCard(zone) {
            const isActive = activeZone === zone.id;
            const status = isActive ? 'active' : 'idle';
            const nextRun = getZoneNextRun(zone.id);

            const statusColors = {
                active: {
                    bg: 'bg-green-500/20',
                    border: 'border-green-500/50',
                    hover: 'hover:bg-green-500/30',
                    text: 'text-green-200',
                    badge: 'bg-green-500/30 text-green-100',
                    dot: 'bg-green-400 animate-pulse',
                    label: 'text-green-300'
                },
                idle: {
                    bg: 'bg-white/5',
                    border: 'border-white/10',
                    hover: 'hover:bg-white/10',
                    text: 'text-emerald-200',
                    badge: 'bg-white/5 text-emerald-200',
                    dot: 'bg-gray-400',
                    label: 'text-emerald-300'
                }
            };

            const colors = statusColors[status];

            let statusContent = '';
            if (isActive) {
                const timeDisplay = remainingMins > 0 ? ` (${remainingMins} min left)` : '';
                statusContent = `
                    <div class="${colors.badge} rounded-lg px-3 py-2">
                        <p class="font-semibold text-center">RUNNING${timeDisplay}</p>
                    </div>
                `;
            } else {
                statusContent = `
                    <div class="${colors.badge} rounded-lg px-3 py-2">
                        <p class="font-semibold text-center">IDLE</p>
                    </div>
                `;
            }

            // Next run info
            const nextRunContent = nextRun.text === 'No schedule'
                ? `<p class="text-emerald-400 text-xs">No schedule</p>`
                : `<div class="text-xs ${colors.text}">
                       <p class="font-semibold">Next Run:</p>
                       <p>${nextRun.text}${nextRun.duration ? ` (${nextRun.duration} min)` : ''}</p>
                   </div>`;

            return `
                <div class="${colors.bg} backdrop-blur rounded-xl p-5 border ${colors.border} transition-all">
                    <div class="flex items-start justify-between mb-3">
                        <div>
                            <p class="text-sm ${colors.label} font-semibold">ZONE ${zone.id}</p>
                            <h3 class="text-lg font-bold text-white">${zone.name}</h3>
                        </div>
                        <div class="w-3 h-3 ${colors.dot} rounded-full"></div>
                    </div>
                    <div class="space-y-2">
                        ${statusContent}
                        ${nextRunContent}
                    </div>
                </div>
            `;
        }

        // Stop all zones
        async function stopAllZones() {
            try {
                await API.zoneOff();
                await loadZones();
            } catch (error) {
                console.error('Error stopping zones:', error);
            }
        }

        // Manual control modal
        let allZones = [];

        function openManualControl() {
            const modal = document.getElementById('manual-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            populateManualZones();
        }

        function closeManualControl() {
            const modal = document.getElementById('manual-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function populateManualZones() {
            const container = document.getElementById('manual-zones');
            const enabledZones = allZones.filter(z => z.enabled);

            if (enabledZones.length === 0) {
                container.innerHTML = '<p class="text-emerald-300 text-center py-4">No zones enabled</p>';
                return;
            }

            container.innerHTML = enabledZones.map(zone => {
                const isActive = activeZone === zone.id;
                const statusText = isActive ? `<span class="text-green-400">(Running - ${remainingMins} min left)</span>` : '';

                return `
                    <div class="flex items-center justify-between bg-white/5 rounded-lg p-3 border border-white/10">
                        <div>
                            <span class="text-white font-semibold">Zone ${zone.id}</span>
                            <span class="text-emerald-300 ml-2">${zone.name}</span>
                            ${statusText}
                        </div>
                        ${isActive
                            ? `<button onclick="manualStop(${zone.id})" class="bg-red-500/30 hover:bg-red-500/40 border border-red-500/50 text-red-100 px-4 py-1 rounded-lg text-sm font-semibold">Stop</button>`
                            : `<button onclick="manualStart(${zone.id})" class="bg-green-500/30 hover:bg-green-500/40 border border-green-500/50 text-green-100 px-4 py-1 rounded-lg text-sm font-semibold">Start</button>`
                        }
                    </div>
                `;
            }).join('');
        }

        async function manualStart(zoneId) {
            const duration = document.getElementById('manual-duration').value;
            try {
                await API.zoneOn(zoneId, duration);
                await loadZones();
                populateManualZones();
            } catch (error) {
                console.error('Error starting zone:', error);
            }
        }

        async function manualStop(zoneId) {
            try {
                await API.zoneOff(zoneId);
                await loadZones();
                populateManualZones();
            } catch (error) {
                console.error('Error stopping zone:', error);
            }
        }

        // Load schedules
        async function loadSchedules() {
            try {
                const data = await API.getSchedules();
                schedules = data.schedules || [];
            } catch (error) {
                console.error('Error loading schedules:', error);
                schedules = [];
            }
        }

        // Load and display zones
        async function loadZones() {
            try {
                // Load schedules and zone status
                await loadSchedules();

                // Get active zone status
                try {
                    const status = await API.getZoneStatus();
                    activeZone = status.activeZone || 0;
                    remainingMins = status.remainingMins || 0;
                } catch (e) {
                    activeZone = 0;
                    remainingMins = 0;
                }

                const data = await API.getZones();
                allZones = data.zones || [];
                const container = document.getElementById('zones-container');

                // Filter to only show enabled zones
                const enabledZones = allZones.filter(zone => zone.enabled);

                if (enabledZones.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-full text-center py-8">
                            <p class="text-emerald-300">No zones enabled.</p>
                            <a href="/zones.shtml" class="text-emerald-400 hover:text-emerald-200 underline">Configure zones</a>
                        </div>
                    `;
                } else {
                    container.innerHTML = enabledZones.map(zone => createZoneCard(zone)).join('');
                }
            } catch (error) {
                console.error('Error loading zones:', error);
                document.getElementById('zones-container').innerHTML = `
                    <div class="col-span-full text-center py-8">
                        <p class="text-red-300">Failed to load zones</p>
                    </div>
                `;
            }
        }

        // Initialize dashboard
        let isRefreshing = false;

        async function refreshData() {
            if (isRefreshing) return; // Don't stack requests
            isRefreshing = true;
            try {
                await updateServerTime();
                await loadSensorData();
                await loadZones();
            } catch (error) {
                console.error('Refresh error:', error);
            } finally {
                isRefreshing = false;
            }
        }

        async function initDashboard() {
            updateTime();
            await refreshData();

            // Update browser time every minute
            setInterval(updateTime, 60000);

            // Refresh data every 30 seconds (don't overwhelm the Pico)
            setInterval(refreshData, 30000);
        }

        // Start dashboard when page loads
        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
