<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SprinklerMaster - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-h-screen p-4">
    <div class="max-w-7xl mx-auto">

        <!-- Header -->
        <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-6 mb-6 border border-white/20">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between">
                <div>
                    <h1 class="text-4xl font-bold text-white mb-2">SprinklerMaster</h1>
                    <p class="text-purple-200">Automated Irrigation Control</p>
                </div>
                <div class="mt-4 md:mt-0 flex flex-col items-start md:items-end gap-2">
                    <div id="system-status" class="flex items-center gap-2 bg-green-500/20 border border-green-500/50 rounded-full px-4 py-2">
                        <div class="w-3 h-3 bg-green-400 rounded-full animate-pulse"></div>
                        <span class="text-green-200 font-medium">System Online</span>
                    </div>
                    <p id="current-time" class="text-purple-300 text-sm"></p>
                </div>
            </div>
        </div>

        <!-- Environmental Monitoring -->
        <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-6 mb-6 border border-white/20">
            <h2 class="text-2xl font-semibold text-white mb-4">Environmental Data</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="bg-white/5 rounded-xl p-6 border border-white/10">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-purple-200 text-sm mb-1">Temperature</p>
                            <p class="text-5xl font-bold text-white">
                                <span id="temperature">--</span><span class="text-2xl text-purple-300">°F</span>
                            </p>
                        </div>
                        <div class="text-6xl">🌡️</div>
                    </div>
                </div>
                <div class="bg-white/5 rounded-xl p-6 border border-white/10">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-purple-200 text-sm mb-1">Humidity</p>
                            <p class="text-5xl font-bold text-white">
                                <span id="humidity">--</span><span class="text-2xl text-purple-300">%</span>
                            </p>
                        </div>
                        <div class="text-6xl">💧</div>
                    </div>
                </div>
            </div>
            <p id="sensor-update" class="text-purple-300 text-sm mt-4 text-center">Last updated: --</p>
        </div>

        <!-- Irrigation Zones -->
        <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-6 border border-white/20">
            <h2 class="text-2xl font-semibold text-white mb-6">Irrigation Zones</h2>
            <div id="zones-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <!-- Zones will be populated by JavaScript -->
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-6 mt-6 border border-white/20">
            <h2 class="text-2xl font-semibold text-white mb-4">Quick Actions</h2>
            <div class="flex flex-wrap gap-3">
                <button class="bg-purple-500/20 hover:bg-purple-500/30 border border-purple-500/50 text-purple-100 px-6 py-3 rounded-lg font-semibold transition-all">
                    Manual Control
                </button>
                <button class="bg-purple-500/20 hover:bg-purple-500/30 border border-purple-500/50 text-purple-100 px-6 py-3 rounded-lg font-semibold transition-all">
                    Schedule Manager
                </button>
                <button class="bg-purple-500/20 hover:bg-purple-500/30 border border-purple-500/50 text-purple-100 px-6 py-3 rounded-lg font-semibold transition-all">
                    Zone Settings
                </button>
                <button class="bg-purple-500/20 hover:bg-purple-500/30 border border-purple-500/50 text-purple-100 px-6 py-3 rounded-lg font-semibold transition-all">
                    System Settings
                </button>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-8 pb-8">
            <p class="text-purple-300 text-sm">
                Powered by FreeRTOS • lwIP • Pico SDK 2.2.0 • Raspberry Pi Pico 2W
            </p>
        </div>

    </div>

    <script>
        // Mock API Configuration
        const API_BASE_URL = '/api'; // When running on Pico, this will be the actual API
        const USE_MOCK_DATA = true;  // Set to false when real API is available

        // Mock API Endpoints
        const MockAPI = {
            // GET /api/status
            getSystemStatus: async () => {
                return {
                    online: true,
                    timestamp: new Date().toISOString(),
                    uptime: 86400 // seconds
                };
            },

            // GET /api/sensors
            getSensorData: async () => {
                return {
                    temperature: 72,
                    humidity: 45,
                    lastUpdate: "2 minutes ago"
                };
            },

            // GET /api/zones
            getZones: async () => {
                return [
                    {
                        id: 1,
                        name: "Front Lawn",
                        status: "active",
                        remaining: "12 min",
                        nextRun: "Tomorrow 6:00 AM",
                        duration: "30 min"
                    },
                    {
                        id: 2,
                        name: "Garden Bed",
                        status: "idle",
                        nextRun: "Today 8:00 PM",
                        duration: "15 min"
                    },
                    {
                        id: 3,
                        name: "Back Yard",
                        status: "idle",
                        nextRun: "Mon/Wed/Fri 5:30 AM",
                        duration: "25 min"
                    },
                    {
                        id: 4,
                        name: "Side Yard",
                        status: "idle",
                        nextRun: "Every 2 days 6:00 AM",
                        duration: "10 min"
                    },
                    {
                        id: 5,
                        name: "Drip Line A",
                        status: "idle",
                        nextRun: "Daily 7:00 AM",
                        duration: "20 min"
                    },
                    {
                        id: 6,
                        name: "Drip Line B",
                        status: "scheduled",
                        startsIn: "2h 15m",
                        duration: "20 min"
                    },
                    {
                        id: 7,
                        name: "Vegetable Garden",
                        status: "idle",
                        nextRun: "Mon/Thu 6:30 AM",
                        duration: "35 min"
                    },
                    {
                        id: 8,
                        name: "Flower Beds",
                        status: "idle",
                        nextRun: "Not scheduled",
                        duration: "—"
                    }
                ];
            }
        };

        // Real API Functions (will be used when USE_MOCK_DATA = false)
        const RealAPI = {
            getSystemStatus: async () => {
                const response = await fetch(`${API_BASE_URL}/status`);
                return await response.json();
            },

            getSensorData: async () => {
                const response = await fetch(`${API_BASE_URL}/sensors`);
                return await response.json();
            },

            getZones: async () => {
                const response = await fetch(`${API_BASE_URL}/zones`);
                return await response.json();
            }
        };

        // API wrapper to switch between mock and real
        const API = USE_MOCK_DATA ? MockAPI : RealAPI;

        // Update current time
        function updateTime() {
            const now = new Date();
            const options = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };
            document.getElementById('current-time').textContent = now.toLocaleDateString('en-US', options);
        }

        // Load and display sensor data
        async function loadSensorData() {
            try {
                const data = await API.getSensorData();
                document.getElementById('temperature').textContent = data.temperature;
                document.getElementById('humidity').textContent = data.humidity;
                document.getElementById('sensor-update').textContent = `Last updated: ${data.lastUpdate}`;
            } catch (error) {
                console.error('Error loading sensor data:', error);
            }
        }

        // Create zone card HTML
        function createZoneCard(zone) {
            const statusColors = {
                active: {
                    bg: 'bg-green-500/20',
                    border: 'border-green-500/50',
                    hover: 'hover:bg-green-500/30',
                    text: 'text-green-200',
                    badge: 'bg-green-500/30 text-green-100',
                    dot: 'bg-green-400 animate-pulse',
                    label: 'text-green-300'
                },
                scheduled: {
                    bg: 'bg-blue-500/20',
                    border: 'border-blue-500/50',
                    hover: 'hover:bg-blue-500/30',
                    text: 'text-blue-200',
                    badge: 'bg-blue-500/30 text-blue-100',
                    dot: 'bg-blue-400 animate-pulse',
                    label: 'text-blue-300'
                },
                idle: {
                    bg: 'bg-white/5',
                    border: 'border-white/10',
                    hover: 'hover:bg-white/10',
                    text: 'text-purple-200',
                    badge: 'bg-white/5 text-purple-200',
                    dot: 'bg-gray-400',
                    label: 'text-purple-300'
                }
            };

            const colors = statusColors[zone.status] || statusColors.idle;

            let statusContent = '';
            if (zone.status === 'active') {
                statusContent = `
                    <div class="${colors.badge} rounded-lg px-3 py-2">
                        <p class="font-semibold text-center">RUNNING</p>
                        <p class="${colors.text} text-sm text-center">${zone.remaining} remaining</p>
                    </div>
                    <div class="text-xs ${colors.text}">
                        <p class="font-semibold">Next Run:</p>
                        <p>${zone.nextRun} (${zone.duration})</p>
                    </div>
                `;
            } else if (zone.status === 'scheduled') {
                statusContent = `
                    <div class="${colors.badge} rounded-lg px-3 py-2">
                        <p class="font-semibold text-center">SCHEDULED</p>
                        <p class="${colors.text} text-sm text-center">Starts in ${zone.startsIn}</p>
                    </div>
                    <div class="text-xs ${colors.text}">
                        <p class="font-semibold">Duration:</p>
                        <p>${zone.duration}</p>
                    </div>
                `;
            } else {
                statusContent = `
                    <div class="${colors.badge} rounded-lg px-3 py-2">
                        <p class="font-semibold text-center">IDLE</p>
                    </div>
                    <div class="text-xs ${colors.text}">
                        <p class="font-semibold">Next Run:</p>
                        <p>${zone.nextRun === 'Not scheduled' ? '<span class="text-purple-400">' + zone.nextRun + '</span>' : zone.nextRun + ' (' + zone.duration + ')'}</p>
                    </div>
                `;
            }

            return `
                <div class="${colors.bg} backdrop-blur rounded-xl p-5 border ${colors.border} ${colors.hover} transition-all">
                    <div class="flex items-start justify-between mb-3">
                        <div>
                            <p class="text-sm ${colors.label} font-semibold">ZONE ${zone.id}</p>
                            <h3 class="text-lg font-bold text-white">${zone.name}</h3>
                        </div>
                        <div class="w-3 h-3 ${colors.dot} rounded-full"></div>
                    </div>
                    <div class="space-y-2">
                        ${statusContent}
                    </div>
                </div>
            `;
        }

        // Load and display zones
        async function loadZones() {
            try {
                const zones = await API.getZones();
                const container = document.getElementById('zones-container');
                container.innerHTML = zones.map(zone => createZoneCard(zone)).join('');
            } catch (error) {
                console.error('Error loading zones:', error);
            }
        }

        // Load system status
        async function loadSystemStatus() {
            try {
                const status = await API.getSystemStatus();
                const statusEl = document.getElementById('system-status');
                if (status.online) {
                    statusEl.innerHTML = `
                        <div class="w-3 h-3 bg-green-400 rounded-full animate-pulse"></div>
                        <span class="text-green-200 font-medium">System Online</span>
                    `;
                } else {
                    statusEl.className = 'flex items-center gap-2 bg-red-500/20 border border-red-500/50 rounded-full px-4 py-2';
                    statusEl.innerHTML = `
                        <div class="w-3 h-3 bg-red-400 rounded-full"></div>
                        <span class="text-red-200 font-medium">System Offline</span>
                    `;
                }
            } catch (error) {
                console.error('Error loading system status:', error);
            }
        }

        // Initialize dashboard
        async function initDashboard() {
            updateTime();
            await loadSystemStatus();
            await loadSensorData();
            await loadZones();

            // Update time every minute
            setInterval(updateTime, 60000);

            // Refresh data every 5 seconds (adjust as needed)
            setInterval(async () => {
                await loadSensorData();
                await loadZones();
                await loadSystemStatus();
            }, 5000);
        }

        // Start dashboard when page loads
        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
