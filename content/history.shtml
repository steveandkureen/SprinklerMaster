<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SprinklerMaster - Watering History</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-amber-900 to-slate-900 min-h-screen p-4">
    <div class="max-w-2xl mx-auto">

        <!-- Header -->
        <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-6 mb-6 border border-white/20">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-3xl font-bold text-white">Watering History</h1>
                    <p class="text-amber-200">Recent watering events</p>
                </div>
                <a href="/dashboard.html" class="bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/50 text-amber-100 px-4 py-2 rounded-lg font-semibold transition-all">
                    Back to Dashboard
                </a>
            </div>
        </div>

        <!-- History Table -->
        <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-6 mb-6 border border-white/20">
            <div id="history-container">
                <p class="text-amber-200 text-center">Loading...</p>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-8 pb-8">
            <p class="text-amber-300 text-sm">
                Powered by lwIP &bull; Pico SDK 2.2.0 &bull; Raspberry Pi Pico 2W
            </p>
        </div>
    </div>

    <script>
        function formatDuration(sec) {
            if (sec <= 0) return 'Skipped';
            var m = Math.floor(sec / 60);
            var s = sec % 60;
            if (m > 0 && s > 0) return m + 'm ' + s + 's';
            if (m > 0) return m + 'm';
            return s + 's';
        }

        function formatTrigger(t) {
            switch (t) {
            case 'manual': return 'Manual';
            case 'schedule': return 'Schedule';
            case 'program': return 'Program';
            case 'freeze_skip': return 'Freeze Skip';
            default: return t;
            }
        }

        function triggerColor(t) {
            switch (t) {
            case 'manual': return 'text-emerald-300';
            case 'schedule': return 'text-amber-300';
            case 'program': return 'text-purple-300';
            case 'freeze_skip': return 'text-blue-300';
            default: return 'text-white';
            }
        }

        async function loadHistory() {
            try {
                var resp = await fetch('/api/history.json');
                var events = await resp.json();
                var container = document.getElementById('history-container');

                if (!events || events.length === 0) {
                    container.innerHTML = '<p class="text-amber-200 text-center py-4">No watering events recorded yet.</p>';
                    return;
                }

                var html = '<div class="overflow-x-auto"><table class="w-full text-sm">';
                html += '<thead><tr class="border-b border-white/20">';
                html += '<th class="text-left text-amber-200 py-2 px-2">Time</th>';
                html += '<th class="text-left text-amber-200 py-2 px-2">Zone</th>';
                html += '<th class="text-left text-amber-200 py-2 px-2">Trigger</th>';
                html += '<th class="text-left text-amber-200 py-2 px-2">Duration</th>';
                html += '</tr></thead><tbody>';

                for (var i = 0; i < events.length; i++) {
                    var e = events[i];
                    var timeStr = new Date(e.ts * 1000).toLocaleString();
                    var durStr = formatDuration(e.d);
                    var trigStr = formatTrigger(e.t);
                    var color = triggerColor(e.t);

                    html += '<tr class="border-b border-white/10">';
                    html += '<td class="text-white py-2 px-2">' + timeStr + '</td>';
                    html += '<td class="text-white py-2 px-2">Zone ' + e.z + '</td>';
                    html += '<td class="' + color + ' py-2 px-2">' + trigStr + '</td>';
                    html += '<td class="text-white py-2 px-2">' + durStr + '</td>';
                    html += '</tr>';
                }

                html += '</tbody></table></div>';
                container.innerHTML = html;
            } catch (error) {
                document.getElementById('history-container').innerHTML =
                    '<p class="text-red-300 text-center py-4">Failed to load history</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadHistory);
    </script>
</body>
</html>
