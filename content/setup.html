<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SprinklerMaster Setup</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#1a1a2e;color:#e0e0e0;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#16213e;border-radius:12px;padding:2rem;width:90%;max-width:360px;box-shadow:0 4px 24px rgba(0,0,0,.4)}
h1{text-align:center;color:#4ecca3;margin-bottom:.5rem;font-size:1.4rem}
p.sub{text-align:center;color:#888;margin-bottom:1.5rem;font-size:.85rem}
label{display:block;margin-bottom:.3rem;font-size:.9rem;color:#aaa}
input{width:100%;padding:.6rem;margin-bottom:1rem;border:1px solid #333;border-radius:6px;background:#0f3460;color:#e0e0e0;font-size:1rem}
input:focus{outline:none;border-color:#4ecca3}
button{width:100%;padding:.7rem;background:#4ecca3;color:#1a1a2e;border:none;border-radius:6px;font-size:1rem;font-weight:bold;cursor:pointer}
button:hover{background:#3dbb92}
button:disabled{background:#555;cursor:not-allowed}
#msg{text-align:center;margin-top:1rem;font-size:.9rem;min-height:1.2rem}
.ok{color:#4ecca3}.err{color:#e74c3c}
</style>
</head>
<body>
<div class="card">
<h1>SprinklerMaster</h1>
<p class="sub">WiFi Setup</p>
<form id="f" onsubmit="return doSave()">
<label for="s">WiFi Network (SSID)</label>
<input id="s" name="ssid" required maxlength="32" autocomplete="off">
<label for="p">Password</label>
<input id="p" name="pass" type="password" maxlength="64">
<button type="submit" id="btn">Save &amp; Reboot</button>
</form>
<div id="msg"></div>
</div>
<script>
function doSave(){
var s=document.getElementById('s').value.trim();
var p=document.getElementById('p').value;
var m=document.getElementById('msg');
var b=document.getElementById('btn');
if(!s){m.className='err';m.textContent='SSID is required';return false;}
b.disabled=true;
b.textContent='Saving...';
var x=new XMLHttpRequest();
x.open('GET','/api/wifi/save?ssid='+encodeURIComponent(s)+'&pass='+encodeURIComponent(p));
x.onload=function(){
if(x.status===200){
m.className='ok';
m.textContent='Saved! Rebooting in 3 seconds...';
setTimeout(function(){
var r=new XMLHttpRequest();
r.open('GET','/api/wifi/reboot');
r.send();
},3000);
}else{
m.className='err';
m.textContent='Save failed. Try again.';
b.disabled=false;
b.textContent='Save & Reboot';
}
};
x.onerror=function(){
m.className='err';
m.textContent='Connection error. Try again.';
b.disabled=false;
b.textContent='Save & Reboot';
};
x.send();
return false;
}
</script>
</body>
</html>
